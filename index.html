<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZBEAR OS - Security Terminal</title>
    <style>
        :root {
            --crt-green: #33ff00;
            --crt-dark: #052200;
            --crt-bg: #0a0a0a;
            --crt-red: #ff3333;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--crt-bg);
            color: var(--crt-green);
            font-family: var(--font-main);
            overflow-x: hidden;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Intro Screen */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 10px;
            z-index: 10000;
            text-shadow: 0 0 10px white;
            transition: opacity 1.5s ease-out;
        }

        /* Header & Nav */
        header {
            border-bottom: 2px solid var(--crt-green);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
        }

        .header-controls {
            display: flex;
            gap: 15px;
        }

        button {
            background: transparent;
            color: var(--crt-green);
            border: 1px solid var(--crt-green);
            padding: 8px 15px;
            font-family: var(--font-main);
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--crt-green);
            color: #000;
            box-shadow: 0 0 10px var(--crt-green);
        }

        #top-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px 20px;
            border-bottom: 1px dashed var(--crt-green);
        }

        .nav-btn.active {
            background: var(--crt-green);
            color: #000;
            box-shadow: 0 0 10px var(--crt-green);
        }

        /* Main Content */
        #main-content {
            padding: 20px;
        }

        #game-title {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 5px var(--crt-green);
            text-align: center;
            border-bottom: 1px solid var(--crt-dark);
            padding-bottom: 10px;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            border: 1px solid var(--crt-green);
            padding: 10px;
            text-align: center;
            background: rgba(0, 50, 0, 0.1);
            position: relative;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            border-bottom: 1px solid var(--crt-green);
            margin-bottom: 10px;
            transition: filter 0.3s;
        }

        .card:hover img {
            filter: grayscale(0%) contrast(1);
        }

        .status-monitored {
            color: #aaa;
            font-size: 0.8rem;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid var(--crt-green);
            padding: 20px;
            z-index: 2000;
            box-shadow: 0 0 20px var(--crt-green);
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1999;
        }

        .modal input, .modal select, .modal textarea {
            width: 100%;
            background: #111;
            color: var(--crt-green);
            border: 1px solid var(--crt-green);
            padding: 10px;
            margin-bottom: 15px;
            font-family: var(--font-main);
        }

        .modal h2 {
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid var(--crt-green);
            padding-bottom: 10px;
        }

        .close-btn {
            float: right;
            border: none;
            background: none;
            color: var(--crt-red);
            font-size: 1.5rem;
        }

        /* Details Modal (Dossier) */
        .dossier-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .dossier-images {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dossier-images img {
            width: 100%;
            border: 1px solid var(--crt-green);
            filter: grayscale(100%);
            transition: 0.3s;
        }
        .dossier-images img:hover {
            filter: grayscale(0%);
        }

        .ai-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .ai-table th, .ai-table td {
            border: 1px solid var(--crt-green);
            padding: 5px;
            text-align: center;
        }

        /* Admin Panel */
        #admin-panel {
            display: none;
            border: 2px dashed var(--crt-green);
            padding: 20px;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--crt-green);
            padding: 10px;
            text-align: left;
        }

        .btn-danger { color: #fff; background: var(--crt-red); border-color: var(--crt-red); }
        .btn-danger:hover { background: darkred; box-shadow: 0 0 10px red; }
        
        .btn-warn { color: #000; background: #c2c200; border-color: #c2c200; }
        .btn-warn:hover { background: #8a8a00; box-shadow: 0 0 10px yellow; }

        .form-group-nights {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .admin-sections {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .admin-tab-btn { flex: 1; }
        
        .admin-section-content { display: none; }
        .admin-section-content.active { display: block; }

    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro-screen">PROJECT FNAF</div>

    <!-- Header -->
    <header>
        <div>FAZBEAR OS <span id="sync-status" style="font-size:0.8rem; color: yellow;">[ CONNECTING... ]</span></div>
        <div class="header-controls">
            <button id="lang-btn" onclick="toggleLang()">[PT-BR]</button>
            <button id="login-btn" onclick="abrirModal('loginModal')">LOGIN</button>
            <button id="admin-btn" style="display:none;" onclick="toggleAdminPanel()">MODO ADMIN</button>
        </div>
    </header>

    <!-- Top Navigation (Games) -->
    <div id="top-nav">
        <!-- Renderizado via JS -->
    </div>

    <!-- Main View -->
    <div id="main-content">
        <h2 id="game-title">SELECIONE UM ARQUIVO</h2>
        <div id="animatronics-grid" class="grid">
            <!-- Renderizado via JS -->
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <h2>TERMINAL DO ADMINISTRADOR</h2>
        <div class="admin-sections">
            <button class="admin-tab-btn active" onclick="switchAdminTab('sec-animatronics')">GERENCIAR ANIMATRONICS</button>
            <button class="admin-tab-btn" onclick="switchAdminTab('sec-games')">GERENCIAR JOGOS</button>
        </div>

        <!-- Section: Animatronics -->
        <div id="sec-animatronics" class="admin-section-content active">
            <button onclick="abrirModalAnimatronic()">+ NOVO ANIMATRONIC</button>
            <table>
                <thead>
                    <tr>
                        <th class="i18n-name">NOME</th>
                        <th class="i18n-games">JOGOS</th>
                        <th class="i18n-actions">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>

        <!-- Section: Games -->
        <div id="sec-games" class="admin-section-content">
            <button onclick="abrirModalJogo()">+ NOVO JOGO / CATEGORIA</button>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOME NO BOTÃO (CURTO)</th>
                        <th>NOME NA ABA (COMPLETO)</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="games-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modals Overlay -->
    <div class="modal-overlay" id="overlay" onclick="fecharModais()"></div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <button class="close-btn" onclick="fecharModais()">X</button>
        <h2 class="i18n-auth">AUTENTICAÇÃO</h2>
        <input type="password" id="adminPassword" placeholder="INSIRA A CREDENCIAL">
        <button onclick="fazerLogin()" style="width:100%">ENTER</button>
    </div>

    <!-- Game Form Modal -->
    <div class="modal" id="gameModal" style="width: 400px;">
        <button class="close-btn" onclick="fecharModais()">X</button>
        <h2>DADOS DO JOGO</h2>
        <input type="hidden" id="g-id-hidden">
        
        <label>ID do Sistema (ex: fnaf1):</label>
        <input type="text" id="g-id" placeholder="fnaf1">
        
        <label>Nome no Botão (Curto):</label>
        <input type="text" id="g-short" placeholder="FNAF 1">
        
        <label>Nome na Aba (Completo):</label>
        <input type="text" id="g-full" placeholder="Five Nights at Freddy's 1">
        
        <label>Ordem de Exibição (Número):</label>
        <input type="number" id="g-order" value="1">

        <button onclick="salvarJogo()" style="width:100%; background:var(--crt-green); color:#000;">SALVAR</button>
    </div>

    <!-- Animatronic Form Modal -->
    <div class="modal" id="animatronicModal" style="width: 600px;">
        <button class="close-btn" onclick="fecharModais()">X</button>
        <h2 id="form-anim-title">REGISTRO DE ANIMATRONIC</h2>
        <input type="hidden" id="a-id">
        
        <input type="text" id="a-nome" placeholder="NOME DO ANIMATRONIC">
        <input type="text" id="a-img1" placeholder="URL DA IMAGEM PRINCIPAL">
        <input type="text" id="a-img2" placeholder="URL DA IMAGEM SECUNDÁRIA (Opcional)">
        
        <label>JOGOS (Selecione segurando CTRL):</label>
        <select id="a-games" multiple style="height: 80px;"></select>

        <label>TIPO DE AGRESSIVIDADE:</label>
        <select id="a-agr-tipo" onchange="toggleAgrFields()">
            <option value="unica">Nível Único (Geral)</option>
            <option value="noites">Por Noite (Noite 1 a Custom)</option>
        </select>

        <div id="agr-unica-field">
            <input type="text" id="a-agr-text" placeholder="Ex: Muito Alta, 20, Depende...">
        </div>

        <div id="agr-noites-field" class="form-group-nights" style="display: none;">
            <input type="text" id="a-n1" placeholder="Noite 1">
            <input type="text" id="a-n2" placeholder="Noite 2">
            <input type="text" id="a-n3" placeholder="Noite 3">
            <input type="text" id="a-n4" placeholder="Noite 4">
            <input type="text" id="a-n5" placeholder="Noite 5">
            <input type="text" id="a-n6" placeholder="Noite 6">
            <input type="text" id="a-custom" placeholder="Custom" style="grid-column: span 2;">
        </div>

        <textarea id="a-lore" rows="5" placeholder="HISTÓRICO / LORE"></textarea>
        
        <button onclick="salvarAnimatronic()" style="width:100%; background:var(--crt-green); color:#000;">SALVAR REGISTRO</button>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal" style="width: 800px;">
        <button class="close-btn" onclick="fecharModais()">X</button>
        <h2 id="det-nome">NOME</h2>
        <div class="dossier-layout">
            <div class="dossier-images">
                <img id="det-img1" src="" alt="Principal">
                <img id="det-img2" src="" alt="Secundária" style="display:none;">
            </div>
            <div>
                <p style="color:var(--crt-red); border: 1px solid var(--crt-red); padding: 5px; text-align: center; margin-bottom: 15px;">TOP SECRET COMPROMETIDO</p>
                <div id="det-agressividade-container"></div>
                <h3 style="margin-top: 15px; border-bottom: 1px solid var(--crt-green);">LORE / OBSERVAÇÕES</h3>
                <p id="det-lore" style="margin-top: 10px; font-size: 0.9rem; line-height: 1.4;"></p>
            </div>
        </div>
    </div>


    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CREDENCIAIS FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCIMeI15Ta-_mEfAHp4dwIejgx7x5t1lbA",
            authDomain: "site-fnaf-fazbear.firebaseapp.com",
            projectId: "site-fnaf-fazbear",
            storageBucket: "site-fnaf-fazbear.firebasestorage.app",
            messagingSenderId: "203005114626",
            appId: "1:203005114626:web:1f84024724295b54d5aa1b",
            measurementId: "G-LT4DXL9B8H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESTADO GLOBAL
        window.isAdmin = false;
        window.lang = 'pt';
        window.currentGameId = null;
        
        window.games = JSON.parse(localStorage.getItem('fnaf_games')) || [
            { id: 'fnaf1', shortName: 'FNAF 1', fullName: 'Five Nights at Freddy\'s 1', order: 1 },
            { id: 'fnaf2', shortName: 'FNAF 2', fullName: 'Five Nights at Freddy\'s 2', order: 2 }
        ];
        
        window.animatronics = JSON.parse(localStorage.getItem('fnaf_animatronics')) || [];

        // Dicionário
        const dict = {
            'pt': { btn_login: "LOGIN", status_mon: "STATUS: MONITORADO", spec: "ESPECIFICAÇÕES", edit: "[ EDITAR ]", del: "[ EXCLUIR ]", agr_lvl: "NÍVEL DE AGRESSIVIDADE:", night: "NOITE" },
            'en': { btn_login: "LOGIN", status_mon: "STATUS: MONITORED", spec: "SPECIFICATIONS", edit: "[ EDIT ]", del: "[ DELETE ]", agr_lvl: "AGRESSIVENESS LEVEL:", night: "NIGHT" }
        };

        // INICIALIZAÇÃO
        setTimeout(() => {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('intro-screen').style.display = 'none', 1500);
        }, 2000);

        function initSync() {
            const statusEl = document.getElementById('sync-status');
            
            // Sincronizar Jogos
            try {
                onSnapshot(collection(db, "artifacts/1f84024724295b54d5aa1b/public/data/games"), (snapshot) => {
                    let tempGames = [];
                    snapshot.forEach(doc => tempGames.push({ id: doc.id, ...doc.data() }));
                    if(tempGames.length > 0) {
                        window.games = tempGames.sort((a,b) => a.order - b.order);
                        localStorage.setItem('fnaf_games', JSON.stringify(window.games));
                    }
                    renderNav();
                    renderGamesAdmin();
                    statusEl.innerText = "[ REALTIME SYNC ONLINE ]";
                    statusEl.style.color = "var(--crt-green)";
                }, (error) => {
                    statusEl.innerText = "[ LOCAL MODE (DB LOCKED) ]";
                    renderNav();
                    renderGamesAdmin();
                });
            } catch (e) { renderNav(); }

            // Sincronizar Animatronics
            try {
                onSnapshot(collection(db, "artifacts/1f84024724295b54d5aa1b/public/data/animatronics"), (snapshot) => {
                    let tempAnim = [];
                    snapshot.forEach(doc => tempAnim.push({ id: doc.id, ...doc.data() }));
                    if(tempAnim.length > 0) {
                        window.animatronics = tempAnim;
                        localStorage.setItem('fnaf_animatronics', JSON.stringify(window.animatronics));
                    }
                    if(window.currentGameId) carregarJogo(window.currentGameId);
                    renderAdminTable();
                }, (error) => {
                    if(window.currentGameId) carregarJogo(window.currentGameId);
                    renderAdminTable();
                });
            } catch (e) {}
        }

        // RENDERIZAÇÕES
        window.renderNav = function() {
            const nav = document.getElementById('top-nav');
            const selectGames = document.getElementById('a-games');
            nav.innerHTML = '';
            selectGames.innerHTML = '';

            window.games.forEach(g => {
                // Menu topo
                const btn = document.createElement('button');
                btn.className = 'nav-btn' + (window.currentGameId === g.id ? ' active' : '');
                btn.innerText = g.shortName;
                btn.onclick = () => carregarJogo(g.id);
                nav.appendChild(btn);

                // Select do formulário
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.shortName;
                selectGames.appendChild(opt);
            });

            if(!window.currentGameId && window.games.length > 0) {
                carregarJogo(window.games[0].id);
            }
        };

        window.carregarJogo = function(id) {
            window.currentGameId = id;
            const game = window.games.find(g => g.id === id);
            document.getElementById('game-title').innerText = game ? game.fullName.toUpperCase() : 'ARQUIVO DESCONHECIDO';
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('active');
                if(b.innerText === (game ? game.shortName : '')) b.classList.add('active');
            });

            const grid = document.getElementById('animatronics-grid');
            grid.innerHTML = '';

            const filtrados = window.animatronics.filter(a => a.games && a.games.includes(id));
            
            filtrados.forEach(anim => {
                let adminBtns = '';
                if(window.isAdmin) {
                    adminBtns = `
                        <div style="display:flex; gap:5px; margin-top:10px;">
                            <button onclick="editarAnimatronic('${anim.id}')" class="btn-warn" style="flex:1;">${dict[window.lang].edit}</button>
                            <button onclick="excluirAnimatronic('${anim.id}')" class="btn-danger" style="flex:1;">${dict[window.lang].del}</button>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="card">
                        <img src="${anim.imagemPrincipal || ''}" alt="${anim.nome}">
                        <h3>${anim.nome.toUpperCase()}</h3>
                        <p class="status-monitored">${dict[window.lang].status_mon}</p>
                        <button style="width:100%" onclick="abrirDetalhes('${anim.id}')">${dict[window.lang].spec}</button>
                        ${adminBtns}
                    </div>
                `;
            });
        };

        // ADMIN FUNÇÕES
        window.fazerLogin = function() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === 'fnaf67') {
                window.isAdmin = true;
                document.getElementById('admin-btn').style.display = 'inline-block';
                document.getElementById('login-btn').style.display = 'none';
                fecharModais();
                toggleAdminPanel();
                if(window.currentGameId) carregarJogo(window.currentGameId);
            } else {
                alert("ACESSO NEGADO");
            }
        };

        window.toggleAdminPanel = function() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            renderAdminTable();
            renderGamesAdmin();
        };

        window.switchAdminTab = function(tabId) {
            document.querySelectorAll('.admin-section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.admin-tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        };

        // GERENCIAR JOGOS
        window.renderGamesAdmin = function() {
            const tbody = document.getElementById('games-table-body');
            tbody.innerHTML = '';
            window.games.forEach(g => {
                tbody.innerHTML += `
                    <tr>
                        <td>${g.id}</td>
                        <td>${g.shortName}</td>
                        <td>${g.fullName}</td>
                        <td>
                            <button onclick="abrirModalJogo('${g.id}')" class="btn-warn">[ EDITAR ]</button>
                            <button onclick="excluirJogo('${g.id}')" class="btn-danger">[ EXCLUIR ]</button>
                        </td>
                    </tr>
                `;
            });
        };

        window.abrirModalJogo = function(id = null) {
            if(id) {
                const game = window.games.find(g => g.id === id);
                document.getElementById('g-id-hidden').value = game.id;
                document.getElementById('g-id').value = game.id;
                document.getElementById('g-id').disabled = true; // Não deixa mudar o ID se estiver editando
                document.getElementById('g-short').value = game.shortName;
                document.getElementById('g-full').value = game.fullName;
                document.getElementById('g-order').value = game.order || 99;
            } else {
                document.getElementById('g-id-hidden').value = '';
                document.getElementById('g-id').value = '';
                document.getElementById('g-id').disabled = false;
                document.getElementById('g-short').value = '';
                document.getElementById('g-full').value = '';
                document.getElementById('g-order').value = window.games.length + 1;
            }
            abrirModal('gameModal');
        };

        window.salvarJogo = async function() {
            const isEdit = document.getElementById('g-id-hidden').value !== '';
            const id = document.getElementById('g-id').value.trim().toLowerCase().replace(/\s+/g, '_');
            
            const gameObj = {
                shortName: document.getElementById('g-short').value,
                fullName: document.getElementById('g-full').value,
                order: parseInt(document.getElementById('g-order').value) || 99
            };

            if(!id || !gameObj.shortName) return alert("Preencha ID e Nome Curto!");

            // Local fallback save
            let index = window.games.findIndex(g => g.id === id);
            if(index > -1) { window.games[index] = {id, ...gameObj}; } 
            else { window.games.push({id, ...gameObj}); }
            localStorage.setItem('fnaf_games', JSON.stringify(window.games));
            
            fecharModais();
            renderNav();
            renderGamesAdmin();

            // Firebase save
            try {
                await setDoc(doc(db, "artifacts/1f84024724295b54d5aa1b/public/data/games", id), gameObj);
            } catch(e) { console.warn("Salvo apenas localmente."); }
        };

        window.excluirJogo = async function(id) {
            if(confirm("DELETAR ESTE JOGO? (Animatronics não serão apagados, mas perderão a referência)")) {
                window.games = window.games.filter(g => g.id !== id);
                localStorage.setItem('fnaf_games', JSON.stringify(window.games));
                renderNav();
                renderGamesAdmin();
                try {
                    await deleteDoc(doc(db, "artifacts/1f84024724295b54d5aa1b/public/data/games", id));
                } catch(e) {}
            }
        };

        // GERENCIAR ANIMATRONICS
        window.renderAdminTable = function() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            window.animatronics.forEach(a => {
                tbody.innerHTML += `
                    <tr>
                        <td>${a.nome}</td>
                        <td>${(a.games || []).join(', ')}</td>
                        <td>
                            <button onclick="editarAnimatronic('${a.id}')" class="btn-warn">${dict[window.lang].edit}</button>
                            <button onclick="excluirAnimatronic('${a.id}')" class="btn-danger">${dict[window.lang].del}</button>
                        </td>
                    </tr>
                `;
            });
        };

        window.toggleAgrFields = function() {
            const tipo = document.getElementById('a-agr-tipo').value;
            document.getElementById('agr-unica-field').style.display = tipo === 'unica' ? 'block' : 'none';
            document.getElementById('agr-noites-field').style.display = tipo === 'noites' ? 'grid' : 'none';
        };

        window.abrirModalAnimatronic = function() {
            document.getElementById('a-id').value = '';
            document.getElementById('a-nome').value = '';
            document.getElementById('a-img1').value = '';
            document.getElementById('a-img2').value = '';
            document.getElementById('a-lore').value = '';
            document.getElementById('a-agr-tipo').value = 'unica';
            document.getElementById('a-agr-text').value = '';
            ['n1','n2','n3','n4','n5','n6','custom'].forEach(n => document.getElementById(`a-${n}`).value = '');
            toggleAgrFields();
            abrirModal('animatronicModal');
        };

        window.editarAnimatronic = function(id) {
            const anim = window.animatronics.find(a => a.id === id);
            if(!anim) return;
            
            document.getElementById('a-id').value = anim.id;
            document.getElementById('a-nome').value = anim.nome;
            document.getElementById('a-img1').value = anim.imagemPrincipal;
            document.getElementById('a-img2').value = anim.imagemSecundaria || '';
            document.getElementById('a-lore').value = anim.lore || '';
            
            const select = document.getElementById('a-games');
            Array.from(select.options).forEach(opt => opt.selected = (anim.games || []).includes(opt.value));

            document.getElementById('a-agr-tipo').value = anim.agressividadeTipo || 'unica';
            toggleAgrFields();

            if(anim.agressividadeTipo === 'noites' && anim.agressividadeNoites) {
                ['n1','n2','n3','n4','n5','n6','custom'].forEach(n => {
                    document.getElementById(`a-${n}`).value = anim.agressividadeNoites[n] || '';
                });
            } else {
                document.getElementById('a-agr-text').value = anim.agressividadeTexto || '';
            }
            
            abrirModal('animatronicModal');
        };

        window.salvarAnimatronic = async function() {
            const id = document.getElementById('a-id').value || "anim_" + Date.now();
            const select = document.getElementById('a-games');
            const games = Array.from(select.selectedOptions).map(opt => opt.value);
            
            const tipo = document.getElementById('a-agr-tipo').value;
            let noites = {};
            if(tipo === 'noites') {
                ['n1','n2','n3','n4','n5','n6','custom'].forEach(n => {
                    noites[n] = document.getElementById(`a-${n}`).value;
                });
            }

            const obj = {
                nome: document.getElementById('a-nome').value,
                imagemPrincipal: document.getElementById('a-img1').value,
                imagemSecundaria: document.getElementById('a-img2').value,
                games: games,
                agressividadeTipo: tipo,
                agressividadeTexto: document.getElementById('a-agr-text').value,
                agressividadeNoites: noites,
                lore: document.getElementById('a-lore').value
            };

            // Salva Localmente
            const index = window.animatronics.findIndex(a => a.id === id);
            if(index > -1) window.animatronics[index] = {id, ...obj};
            else window.animatronics.push({id, ...obj});
            localStorage.setItem('fnaf_animatronics', JSON.stringify(window.animatronics));

            fecharModais();
            if(window.currentGameId) carregarJogo(window.currentGameId);
            renderAdminTable();

            // Salva no Firebase
            try {
                await setDoc(doc(db, "artifacts/1f84024724295b54d5aa1b/public/data/animatronics", id), obj);
            } catch(e) {}
        };

        window.excluirAnimatronic = async function(id) {
            if(confirm("CONFIRMAR DELEÇÃO DO REGISTRO?")) {
                window.animatronics = window.animatronics.filter(a => a.id !== id);
                localStorage.setItem('fnaf_animatronics', JSON.stringify(window.animatronics));
                if(window.currentGameId) carregarJogo(window.currentGameId);
                renderAdminTable();
                try {
                    await deleteDoc(doc(db, "artifacts/1f84024724295b54d5aa1b/public/data/animatronics", id));
                } catch(e) {}
            }
        };

        // DETALHES
        window.abrirDetalhes = function(id) {
            const anim = window.animatronics.find(a => a.id === id);
            if(!anim) return;

            document.getElementById('det-nome').innerText = anim.nome.toUpperCase();
            document.getElementById('det-img1').src = anim.imagemPrincipal;
            
            const img2 = document.getElementById('det-img2');
            if(anim.imagemSecundaria) {
                img2.src = anim.imagemSecundaria;
                img2.style.display = 'block';
            } else {
                img2.style.display = 'none';
            }

            document.getElementById('det-lore').innerText = anim.lore || "NO DATA.";

            const contAgr = document.getElementById('det-agressividade-container');
            contAgr.innerHTML = `<h3 style="border-bottom: 1px solid var(--crt-green);">${dict[window.lang].agr_lvl}</h3>`;
            
            if(anim.agressividadeTipo === 'noites') {
                contAgr.innerHTML += `
                    <table class="ai-table">
                        <tr><th>${dict[window.lang].night} 1</th><th>${dict[window.lang].night} 2</th><th>${dict[window.lang].night} 3</th><th>${dict[window.lang].night} 4</th></tr>
                        <tr>
                            <td>${anim.agressividadeNoites.n1||'-'}</td>
                            <td>${anim.agressividadeNoites.n2||'-'}</td>
                            <td>${anim.agressividadeNoites.n3||'-'}</td>
                            <td>${anim.agressividadeNoites.n4||'-'}</td>
                        </tr>
                        <tr><th>${dict[window.lang].night} 5</th><th>${dict[window.lang].night} 6</th><th colspan="2">CUSTOM</th></tr>
                        <tr>
                            <td>${anim.agressividadeNoites.n5||'-'}</td>
                            <td>${anim.agressividadeNoites.n6||'-'}</td>
                            <td colspan="2">${anim.agressividadeNoites.custom||'-'}</td>
                        </tr>
                    </table>
                `;
            } else {
                contAgr.innerHTML += `<p style="margin-top:10px; font-size:1.5rem; text-align:center;">[ ${anim.agressividadeTexto || 'UNKNOWN'} ]</p>`;
            }

            abrirModal('detailsModal');
        };

        // UI E UTILIDADES
        window.abrirModal = id => {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
        };
        
        window.fecharModais = () => {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        };

        window.toggleLang = () => {
            window.lang = window.lang === 'pt' ? 'en' : 'pt';
            document.getElementById('lang-btn').innerText = window.lang === 'pt' ? '[PT-BR]' : '[EN-US]';
            document.getElementById('login-btn').innerText = dict[window.lang].btn_login;
            if(window.currentGameId) carregarJogo(window.currentGameId);
        };

        // STARTUP
        initSync();
    </script>
</body>
</html>
